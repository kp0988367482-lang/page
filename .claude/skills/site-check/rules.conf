# 全站一致性的「正解」。只有站主知道的值放這裡。
#
# 留空 = 尚未確認。check.sh 仍會偵測全站是否有多種寫法並回報，
# 但不會自動改——因為它不知道該改成哪一個。
# 填好之後，`bash check.sh --fix` 就會把全站一次改齊。

# LINE 聯絡連結。
# 判定依據：2026-06 的改版全面改用 LINE 官方帳號（commit 48415f0
# 「paid services -> LINE OA private msg」）。index.html 用的就是這條。
# 舊的 ~seoulmate31 只殘留在 2026-04-19 之後未再維護的三頁。
#
# 例外：success.html 用的 line.me/ti/g/… 是「群組」連結，屬於付款後才進的
# 開放聊天室（同一個 commit 寫明 open chat is post-purchase only）。
# 那條是對的，sitecheck.py 已寫死不會動它。
LINE_URL=https://line.me/R/ti/p/@933rjphz

# Calendly 預約連結。
# 判定依據：booking.html 的實際嵌入用的是 kp0988367482/30min，且帶完整參數
# （hide_gdpr_banner、primary_color），是有在維護的那一條。
# calculator.html 的 seoulmate31 是舊的，沒有參數也沒被更新過。
# 自動修復會保留各頁原有的查詢參數，只換帳號路徑。
CALENDLY_URL=https://calendly.com/kp0988367482/30min

# 每頁 <html> 應有的語言屬性
HTML_LANG=zh-TW

# PayPal 短網址的帳號名（金額由各頁自行決定，不在這裡管）
PAYPAL_USER=HSIANGENTSAI
